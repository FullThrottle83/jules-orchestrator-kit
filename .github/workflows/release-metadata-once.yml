name: Finalize v0.73.1 release metadata once

on:
  push:
    branches:
      - release/0.73.1
    paths:
      - .github/workflows/release-metadata-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/0.73.1
          fetch-depth: 0

      - name: Finalize release metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const lockPath = "package-lock.json";
          let lock = fs.readFileSync(lockPath, "utf8");
          const parsedBefore = JSON.parse(lock);
          if (parsedBefore.version !== "0.73.0" || parsedBefore.packages?.[""]?.version !== "0.73.0") {
            throw new Error("package-lock root versions are not both 0.73.0");
          }
          let replaced = 0;
          lock = lock.replace(/"version": "0\.73\.0"/g, (match) => {
            replaced += 1;
            return replaced <= 2 ? '"version": "0.73.1"' : match;
          });
          const parsedAfter = JSON.parse(lock);
          if (parsedAfter.version !== "0.73.1" || parsedAfter.packages?.[""]?.version !== "0.73.1") {
            throw new Error("package-lock root versions were not updated to 0.73.1");
          }
          fs.writeFileSync(lockPath, lock);

          const changelogPath = "CHANGELOG.md";
          let changelog = fs.readFileSync(changelogPath, "utf8");
          const start = changelog.indexOf("## [Unreleased]");
          const next = changelog.indexOf("\n## [0.73.0] - 2026-09-09", start);
          if (start < 0 || next < 0) throw new Error("expected changelog anchors not found");
          const release = `## [Unreleased]

## [0.73.1] - 2026-09-17

### Changed
- Consolidated contributor instructions in \`AGENTS.md\` and shortened the installed
  rules template while preserving scaffold detection and existing file paths.
- Reworked onboarding, moved Jules guidance to provider documentation and archived
  historical audits. Simplified the roadmap and removed release-note epigraphs.
- Excluded repository-only \`AGENTS.md\` and \`ROADMAP_V1.md\` from the npm payload;
  retained runtime modules, script entry points and scaffold assets.
- Clarified rerunning \`init\` in initialized repositories: back up and review
  \`.agent/config.yml\` and \`.agent/jules.yml\` because the wizard can regenerate them.
- Added deterministic review planning as a later roadmap candidate while keeping AI
  review advisory and separate from the deterministic \`gate\`.
`;
          changelog = changelog.slice(0, start) + release + changelog.slice(next);
          fs.writeFileSync(changelogPath, changelog);
          NODE

          git rm .github/workflows/release-metadata-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json CHANGELOG.md
          git commit -m "chore(release): finalize 0.73.1 metadata"
          git push origin HEAD:release/0.73.1
