name: Jules PR Audit & Test Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x', '24.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax Check
        run: for f in scripts/*.mjs bin/*.js index.mjs; do node --check "$f" || exit 1; done

      - name: Run Unit Tests
        run: npm test

      - name: Run Jules PR Self-Audit Gatekeeper
        if: matrix.node-version == '24.x' && github.event_name == 'pull_request' && (startsWith(github.actor, 'google-labs-jules') || contains(github.actor, 'jules'))
        run: node scripts/jules-self-audit.mjs
        env:
          CI: "true"
          BASE_BRANCH: "main"

