name: Jules PR Audit & Test Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Cache OODA state & ledgers
        uses: actions/cache@v4
        with:
          path: .agent/state/
          key: ooda-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ooda-state-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test --if-present

      - name: Run Jules PR Self-Audit Gatekeeper
        if: matrix.node-version == '20.x' && github.event_name == 'pull_request'
        run: node scripts/jules-self-audit.mjs
        env:
          CI: "true"
          BASE_BRANCH: "main"

