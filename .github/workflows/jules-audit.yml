name: Jules PR Audit & Test Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ${{ matrix.os }}
    # Without this a hung test runs to GitHub's six-hour default. The suite
    # finishes in ~25s on the slowest runner, so anything near this is a hang.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # A compatibility matrix exists to answer "which platforms break?".
      # Fail-fast answers "one did, and we won't say which of the others would
      # have". It cancelled all nine jobs here when a Linux-only policy step
      # failed, destroying the cross-platform signal that is the entire reason
      # the matrix is nine-way — and every cross-platform break this repository
      # has shipped was green on Linux and red on Windows. Nine jobs at ~30s
      # each is not a budget worth optimising against that.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache OODA state & ledgers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .agent/state/
          key: ooda-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ooda-state-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test --if-present

      - name: Run Jules PR Self-Audit Gatekeeper
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x' && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'allow-protected-paths')
        run: node scripts/jules-self-audit.mjs
        env:
          CI: "true"
          BASE_BRANCH: "main"
          JULES_ALLOW_COMMAND_FILE_CHANGES: "false"

  # The same gate `release.mjs` blocks on at step 1b. It was previously only
  # ever run by hand, which is how a stale README test count and an unchecked
  # shipped-milestone item both reached main. Its own checks are
  # platform-independent, and it measures the test counts by running the suite,
  # so it belongs in one job rather than in all nine of the matrix above.
  doc-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # This job runs the suite to measure test counts, and parts of that
          # suite resolve a git base. actions/checkout defaults to depth 1,
          # under which those tests fail — so the full history is not optional
          # here for the same reason it is not optional for the matrix job.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      # A green suite is only evidence if the guards were switched on. This
      # asks the question the suite cannot: can every blocking guard still be
      # made red? Runs first, because a silent guard makes the rest moot.
      - name: Verify every blocking guard can still be made red
        run: npm run guard-reach

      - name: Run Documentation Sync Gate
        run: npm run jules:doc-sync

  zizmor:
    name: GitHub Actions Security Audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

