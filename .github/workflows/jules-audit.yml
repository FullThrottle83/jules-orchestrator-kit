name: Jules PR Audit & Test Gatekeeper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ${{ matrix.os }}
    # Without this a hung test runs to GitHub's six-hour default. The suite
    # finishes in ~25s on the slowest runner, so anything near this is a hang.
    timeout-minutes: 20
    strategy:
      # A compatibility matrix exists to answer "which platforms break?".
      # Fail-fast answers "one did, and we won't say which of the others would
      # have". It cancelled all nine jobs here when a Linux-only policy step
      # failed, destroying the cross-platform signal that is the entire reason
      # the matrix is nine-way — and every cross-platform break this repository
      # has shipped was green on Linux and red on Windows. Nine jobs at ~30s
      # each is not a budget worth optimising against that.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache OODA state & ledgers
        uses: actions/cache@v4
        with:
          path: .agent/state/
          key: ooda-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ooda-state-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test --if-present

      - name: Run Jules PR Self-Audit Gatekeeper
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x' && github.event_name == 'pull_request'
        run: node scripts/jules-self-audit.mjs
        env:
          CI: "true"
          BASE_BRANCH: "main"
          # Two gates guard the same protected paths — this one and
          # agent-scope-guard.yml — and until now they took different bypasses:
          # the scope guard honours the `allow-protected-paths` label documented
          # in AGENTS.md, while this one only ever read an environment variable
          # nothing set. A reviewer following the documented flow labelled the PR
          # and this job stayed red with no way through. Mapping the label onto
          # the variable here unifies them without giving the shipped script a
          # second bypass path of its own. The bypass stays narrow either way:
          # `allowProtected` skips only the protect check in src/security.mjs —
          # deny rules, payload limits and the secret scanner all still run.
          JULES_ALLOW_COMMAND_FILE_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'allow-protected-paths') }}

  # The same gate `release.mjs` blocks on at step 1b. It was previously only
  # ever run by hand, which is how a stale README test count and an unchecked
  # shipped-milestone item both reached main. Its own checks are
  # platform-independent, and it measures the test counts by running the suite,
  # so it belongs in one job rather than in all nine of the matrix above.
  doc-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job runs the suite to measure test counts, and parts of that
          # suite resolve a git base. actions/checkout defaults to depth 1,
          # under which those tests fail — so the full history is not optional
          # here for the same reason it is not optional for the matrix job.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Run Documentation Sync Gate
        run: npm run jules:doc-sync

