name: Jules Nightly Self-Audit

on:
  schedule:
    # 03:00 UTC — a low-traffic window for the default branch's nightly maintenance.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
      - name: Cache OODA state & ledgers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .agent/state/
          key: ooda-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ooda-state-${{ runner.os }}-

      # scripts/jules-nightly.mjs currently runs `git worktree prune` only and
      # makes no Jules API calls, so no secret is injected into the runner
      # environment (previously `secrets.JULES_API_KEY` was exported here but
      # never read by the script). If nightly dispatch to the Jules API is added
      # later, map the secret at the step that needs it instead.
      - name: Run Nightly Maintenance
        run: node scripts/jules-nightly.mjs

  # A broken scheduled job otherwise only surfaces as a notification nobody is
  # watching. Open one tracking issue per failing nightly (deduplicated while an
  # alert is still open) so maintenance rot cannot stay silent. The issue body
  # contains run metadata only — never logs, and never secret material.
  # `issues: write` is scoped to this single job.
  alert-maintainers:
    runs-on: ubuntu-latest
    needs: nightly-audit
    if: failure()
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open tracking issue for the failed nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="[nightly] Jules Nightly Self-Audit failed ($(date -u +%Y-%m-%d))"
          open="$(
            gh issue list --state open --search 'in:title "Jules Nightly Self-Audit failed"' \
              --json number --jq 'length'
          )"
          if [ "${open}" -eq 0 ]; then
            gh issue create \
              --title "${TITLE}" \
              --body "The scheduled **Jules Nightly Self-Audit** workflow failed. Inspect the run — no logs or secrets are included here: ${RUN_URL}"
          else
            echo "An alert issue is already open; not creating a duplicate."
          fi
