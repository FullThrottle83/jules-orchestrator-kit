name: Jules Nightly Self-Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
      - name: Cache OODA state & ledgers
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .agent/state/
          key: ooda-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ooda-state-${{ runner.os }}-
      - name: Dispatch Nightly Maintenance to Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_REPO: ${{ github.repository }}
        run: |
          node scripts/jules-nightly.mjs
