name: Agent Scope Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs the same matcher as the local gate (src/security.mjs checkScope).
      # The previous inline-bash version reimplemented glob matching and its
      # sed expression was invalid, which under `bash -e` aborted the step
      # before it evaluated a single pattern.
      - name: Verify Scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci-scope-guard.mjs
