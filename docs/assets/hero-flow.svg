<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="920" height="190" rx="14" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />

  <!-- Title Badge -->
  <text x="30" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">AUTONOMOUS ORCHESTRATION PIPELINE</text>

  <!-- Step 1: Dispatch -->
  <g transform="translate(30, 52)" filter="url(#glow)">
    <rect width="145" height="105" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <circle cx="25" cy="25" r="11" fill="#6366f1" opacity="0.3" />
    <text x="25" y="29" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="800">1</text>
    <text x="45" y="29" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Dispatch</text>
    <text x="15" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">agentctl / MCP</text>
    <text x="15" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11">CLI / CI / SDK</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 182 104 L 202 104" stroke="#94a3b8" stroke-width="2.5" />
  <polygon points="202,99 211,104 202,109" fill="#94a3b8" />

  <!-- Step 2: CBEE Sandbox -->
  <g transform="translate(213, 52)" filter="url(#glow)">
    <rect width="150" height="105" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="25" cy="25" r="11" fill="#06b6d4" opacity="0.3" />
    <text x="25" y="29" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="800">2</text>
    <text x="45" y="29" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">CBEE Sandbox</text>
    <text x="15" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Immutable Scope</text>
    <text x="15" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11">git worktree</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 370 104 L 390 104" stroke="#94a3b8" stroke-width="2.5" />
  <polygon points="390,99 399,104 390,109" fill="#94a3b8" />

  <!-- Step 3: Safety Gate -->
  <g transform="translate(401, 52)" filter="url(#glow)">
    <rect width="150" height="105" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />
    <circle cx="25" cy="25" r="11" fill="#3b82f6" opacity="0.3" />
    <text x="25" y="29" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="800">3</text>
    <text x="45" y="29" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Safety Gate</text>
    <text x="15" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">4-Phase Audit</text>
    <text x="15" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11">origin/main rules</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 558 104 L 578 104" stroke="#94a3b8" stroke-width="2.5" />
  <polygon points="578,99 587,104 578,109" fill="#94a3b8" />

  <!-- Step 4: OODA Repair -->
  <g transform="translate(589, 52)" filter="url(#glow)">
    <rect width="155" height="105" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2" />
    <circle cx="25" cy="25" r="11" fill="#10b981" opacity="0.3" />
    <text x="25" y="29" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="800">4</text>
    <text x="45" y="29" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">OODA Repair</text>
    <text x="15" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Thrash Guard</text>
    <text x="15" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11">SHA-256 fingerprint</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 751 104 L 771 104" stroke="#94a3b8" stroke-width="2.5" />
  <polygon points="771,99 780,104 771,109" fill="#94a3b8" />

  <!-- Step 5: Ready -->
  <g transform="translate(782, 52)" filter="url(#glow)">
    <rect width="108" height="105" rx="10" fill="#064e3b" stroke="#4ade80" stroke-width="2" />
    <circle cx="25" cy="25" r="11" fill="#22c55e" opacity="0.4" />
    <text x="25" y="29" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">5</text>
    <text x="45" y="29" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Ready</text>
    <text x="15" y="58" fill="#f0fdf4" font-family="sans-serif" font-size="12" font-weight="600">PR Verified</text>
    <text x="15" y="80" fill="#dcfce7" font-family="sans-serif" font-size="11">Exit Code 0</text>
  </g>
</svg>
