<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="100%">
  <defs>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="920" height="160" rx="14" fill="url(#sec-grad)" stroke="#312e81" stroke-width="1.5" />

  <text x="30" y="30" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ZERO-TRUST SECURITY &amp; RELIABILITY GUARANTEES</text>

  <!-- Card 1: CBEE -->
  <g transform="translate(30, 48)" filter="url(#shadow2)">
    <rect width="160" height="85" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="16" y="28" fill="#818cf8" font-family="sans-serif" font-size="12" font-weight="700">🔒 CBEE Envelope</text>
    <text x="16" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">Immutable Scope</text>
    <text x="16" y="64" fill="#64748b" font-family="sans-serif" font-size="10">Pre-flight SHA lock</text>
  </g>

  <!-- Card 2: Zero-Trust -->
  <g transform="translate(205, 48)" filter="url(#shadow2)">
    <rect width="160" height="85" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" />
    <text x="16" y="28" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">🛡️ Zero-Trust Base</text>
    <text x="16" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">origin/main Rules</text>
    <text x="16" y="64" fill="#64748b" font-family="sans-serif" font-size="10">Fail-closed resolution</text>
  </g>

  <!-- Card 3: OODA Thrash Guard -->
  <g transform="translate(380, 48)" filter="url(#shadow2)">
    <rect width="160" height="85" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="1" />
    <text x="16" y="28" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">⚡ OODA Thrash Guard</text>
    <text x="16" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">SHA-256 Fingerprint</text>
    <text x="16" y="64" fill="#64748b" font-family="sans-serif" font-size="10">Early regression halt</text>
  </g>

  <!-- Card 4: Hash Ledger -->
  <g transform="translate(555, 48)" filter="url(#shadow2)">
    <rect width="160" height="85" rx="8" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1" />
    <text x="16" y="28" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="700">⛓️ Hash Ledger</text>
    <text x="16" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">Cryptographic Trail</text>
    <text x="16" y="64" fill="#64748b" font-family="sans-serif" font-size="10">Tamper detection</text>
  </g>

  <!-- Card 5: Secret Scan -->
  <g transform="translate(730, 48)" filter="url(#shadow2)">
    <rect width="160" height="85" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1" />
    <text x="16" y="28" fill="#fcd34d" font-family="sans-serif" font-size="12" font-weight="700">🔑 Secret Scan</text>
    <text x="16" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">Entropy Filter &gt; 3.6</text>
    <text x="16" y="64" fill="#64748b" font-family="sans-serif" font-size="10">Redacts keys &amp; PII</text>
  </g>
</svg>
