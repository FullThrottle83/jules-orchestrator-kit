<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="100%" height="100%">
  <defs>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="920" height="170" rx="14" fill="url(#sec-grad)" stroke="#4338ca" stroke-width="2" />

  <text x="30" y="34" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">ZERO-TRUST SECURITY &amp; RELIABILITY GUARANTEES</text>

  <!-- Card 1: CBEE -->
  <g transform="translate(30, 50)" filter="url(#shadow2)">
    <rect width="160" height="95" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="16" y="30" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="800">🔒 CBEE Envelope</text>
    <text x="16" y="54" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Immutable Scope</text>
    <text x="16" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">Pre-flight SHA lock</text>
  </g>

  <!-- Card 2: Zero-Trust -->
  <g transform="translate(205, 50)" filter="url(#shadow2)">
    <rect width="160" height="95" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
    <text x="16" y="30" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800">🛡️ Zero-Trust Base</text>
    <text x="16" y="54" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">origin/main Rules</text>
    <text x="16" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">Fail-closed resolution</text>
  </g>

  <!-- Card 3: OODA Thrash Guard -->
  <g transform="translate(380, 50)" filter="url(#shadow2)">
    <rect width="160" height="95" rx="8" fill="#1e1b4b" stroke="#34d399" stroke-width="2" />
    <text x="16" y="30" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="800">⚡ Thrash Guard</text>
    <text x="16" y="54" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">SHA-256 Fingerprint</text>
    <text x="16" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">Early regression halt</text>
  </g>

  <!-- Card 4: Hash Ledger -->
  <g transform="translate(555, 50)" filter="url(#shadow2)">
    <rect width="160" height="95" rx="8" fill="#1e1b4b" stroke="#fb7185" stroke-width="2" />
    <text x="16" y="30" fill="#fb7185" font-family="sans-serif" font-size="13" font-weight="800">⛓️ Hash Ledger</text>
    <text x="16" y="54" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Cryptographic Trail</text>
    <text x="16" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">Tamper detection</text>
  </g>

  <!-- Card 5: Secret Scan -->
  <g transform="translate(730, 50)" filter="url(#shadow2)">
    <rect width="160" height="95" rx="8" fill="#1e1b4b" stroke="#fcd34d" stroke-width="2" />
    <text x="16" y="30" fill="#fcd34d" font-family="sans-serif" font-size="13" font-weight="800">🔑 Secret Scan</text>
    <text x="16" y="54" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Entropy Filter &gt; 3.6</text>
    <text x="16" y="74" fill="#cbd5e1" font-family="sans-serif" font-size="11">Redacts keys &amp; PII</text>
  </g>
</svg>
