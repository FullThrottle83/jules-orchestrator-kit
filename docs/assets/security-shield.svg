<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 190" width="100%" height="100%">
  <defs>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="940" height="190" rx="14" fill="url(#sec-grad)" stroke="#4338ca" stroke-width="2" />

  <text x="30" y="36" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5">ZERO-TRUST SECURITY &amp; RELIABILITY GUARANTEES</text>

  <!-- Card 1: CBEE -->
  <g transform="translate(30, 56)">
    <rect width="162" height="110" rx="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" />
    <text x="16" y="32" fill="#c7d2fe" font-family="sans-serif" font-size="15" font-weight="800">🔒 CBEE Envelope</text>
    <text x="16" y="62" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="700">Immutable Scope</text>
    <text x="16" y="86" fill="#e2e8f0" font-family="sans-serif" font-size="12.5" font-weight="600">Pre-flight SHA lock</text>
  </g>

  <!-- Card 2: Zero-Trust -->
  <g transform="translate(208, 56)">
    <rect width="162" height="110" rx="9" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2.5" />
    <text x="16" y="32" fill="#7dd3fc" font-family="sans-serif" font-size="15" font-weight="800">🛡️ Zero-Trust Base</text>
    <text x="16" y="62" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="700">origin/main Rules</text>
    <text x="16" y="86" fill="#e2e8f0" font-family="sans-serif" font-size="12.5" font-weight="600">Fail-closed resolution</text>
  </g>

  <!-- Card 3: OODA Thrash Guard -->
  <g transform="translate(386, 56)">
    <rect width="162" height="110" rx="9" fill="#1e1b4b" stroke="#34d399" stroke-width="2.5" />
    <text x="16" y="32" fill="#6ee7b7" font-family="sans-serif" font-size="15" font-weight="800">⚡ Thrash Guard</text>
    <text x="16" y="62" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="700">SHA-256 Fingerprint</text>
    <text x="16" y="86" fill="#e2e8f0" font-family="sans-serif" font-size="12.5" font-weight="600">Early regression halt</text>
  </g>

  <!-- Card 4: Hash Ledger -->
  <g transform="translate(564, 56)">
    <rect width="162" height="110" rx="9" fill="#1e1b4b" stroke="#fb7185" stroke-width="2.5" />
    <text x="16" y="32" fill="#fda4af" font-family="sans-serif" font-size="15" font-weight="800">⛓️ Hash Ledger</text>
    <text x="16" y="62" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="700">Cryptographic Trail</text>
    <text x="16" y="86" fill="#e2e8f0" font-family="sans-serif" font-size="12.5" font-weight="600">Tamper detection</text>
  </g>

  <!-- Card 5: Secret Scan -->
  <g transform="translate(742, 56)">
    <rect width="162" height="110" rx="9" fill="#1e1b4b" stroke="#fcd34d" stroke-width="2.5" />
    <text x="16" y="32" fill="#fde68a" font-family="sans-serif" font-size="15" font-weight="800">🔑 Secret Scan</text>
    <text x="16" y="62" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="700">Entropy Filter &gt; 3.6</text>
    <text x="16" y="86" fill="#e2e8f0" font-family="sans-serif" font-size="12.5" font-weight="600">Redacts keys &amp; PII</text>
  </g>
</svg>
