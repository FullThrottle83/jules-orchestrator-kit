<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 260" width="100%" height="100%">
  <defs>
    <linearGradient id="flaky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161e2e" />
    </linearGradient>
    <filter id="flaky-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="945" height="260" rx="14" fill="url(#flaky-grad)" stroke="#334155" stroke-width="2" />

  <text x="30" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5">AUTOMATED FLAKY TEST HEALING SWARM ARCHITECTURE</text>

  <!-- Step 1: Statistical Ledger -->
  <g transform="translate(30, 56)">
    <rect width="210" height="175" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="2" filter="url(#flaky-shadow)" />
    <text x="16" y="28" fill="#fda4af" font-family="sans-serif" font-size="13" font-weight="800">1. Statistical Ledger</text>
    <rect x="12" y="44" width="186" height="34" rx="6" fill="#881337" opacity="0.4" />
    <text x="20" y="65" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">.agent/state/flaky.jsonl</text>
    <rect x="12" y="86" width="186" height="68" rx="6" fill="#881337" opacity="0.3" />
    <text x="20" y="104" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="700">Wilson Interval Engine</text>
    <text x="20" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Oscillation &gt;= 0.40</text>
    <text x="20" y="136" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Exit Code 8 (Quarantined)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 143 L 275 143" stroke="#f8fafc" stroke-width="2.5" />
  <polygon points="275,138 285,143 275,148" fill="#f8fafc" />

  <!-- Step 2: Healing Synthesizer -->
  <g transform="translate(290, 56)">
    <rect width="270" height="175" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#flaky-shadow)" />
    <text x="16" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800">2. Anti-Flakiness Synthesizer</text>
    <rect x="12" y="44" width="246" height="54" rx="6" fill="#0369a1" opacity="0.4" />
    <text x="20" y="63" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">No Test Weakening Rule</text>
    <text x="20" y="79" fill="#94a3b8" font-family="sans-serif" font-size="10">Forbids deleting assertions or sleeps;</text>
    <text x="20" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10">targets race conditions &amp; resource leaks</text>

    <rect x="12" y="106" width="246" height="48" rx="6" fill="#0369a1" opacity="0.4" />
    <text x="20" y="124" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Multi-Iteration Oracle</text>
    <text x="20" y="140" fill="#38bdf8" font-family="monospace" font-size="10">cmd &amp;&amp; cmd &amp;&amp; cmd (5x verify)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 565 143 L 595 143" stroke="#f8fafc" stroke-width="2.5" />
  <polygon points="595,138 605,143 595,148" fill="#f8fafc" />

  <!-- Step 3: Swarm Execution -->
  <g transform="translate(610, 56)">
    <rect width="305" height="175" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#flaky-shadow)" />
    <text x="16" y="28" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="800">3. Swarm Healing &amp; Recovery</text>
    <rect x="12" y="44" width="281" height="54" rx="6" fill="#065f46" opacity="0.5" />
    <text x="20" y="63" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Queue / Swarm Execution</text>
    <text x="20" y="79" fill="#a7f3d0" font-family="sans-serif" font-size="10">• .agent/jules-queue/flaky-heal-*.md</text>
    <text x="20" y="92" fill="#a7f3d0" font-family="sans-serif" font-size="10">• Assigned to specialist role (janitor)</text>

    <rect x="12" y="106" width="281" height="48" rx="6" fill="#065f46" opacity="0.5" />
    <text x="20" y="124" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Verification &amp; Unquarantine</text>
    <text x="20" y="140" fill="#34d399" font-family="sans-serif" font-size="10">Deterministic passes restore suite health</text>
  </g>
</svg>
