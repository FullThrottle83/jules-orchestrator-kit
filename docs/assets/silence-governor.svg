<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 280" width="100%" height="100%">
  <defs>
    <linearGradient id="gov-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#161e2e" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="945" height="280" rx="14" fill="url(#gov-grad)" stroke="#334155" stroke-width="2" />

  <text x="30" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5">TYPE III SILENCE GOVERNOR &amp; INTERRUPTION BUDGETING</text>

  <!-- Step 1: Incoming Incident -->
  <g transform="translate(30, 56)">
    <rect width="180" height="195" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#shadow)" />
    <text x="16" y="28" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="800">1. Incident Generated</text>
    
    <rect x="12" y="42" width="156" height="30" rx="6" fill="#312e81" opacity="0.6" />
    <text x="20" y="62" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="700">🚨 R3 Gate Violation</text>

    <rect x="12" y="78" width="156" height="30" rx="6" fill="#312e81" opacity="0.6" />
    <text x="20" y="98" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="700">⚠️ Awaiting Feedback</text>

    <rect x="12" y="114" width="156" height="30" rx="6" fill="#312e81" opacity="0.6" />
    <text x="20" y="134" fill="#f97316" font-family="sans-serif" font-size="11" font-weight="700">🔄 OODA Exhausted</text>

    <rect x="12" y="150" width="156" height="30" rx="6" fill="#312e81" opacity="0.6" />
    <text x="20" y="170" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">ℹ️ Swarm Progress Note</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 215 153 L 245 153" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="4,4" />
  <polygon points="245,148 255,153 245,158" fill="#f8fafc" />

  <!-- Step 2: Silence Governor Core Filter -->
  <g transform="translate(260, 56)">
    <rect width="250" height="195" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
    <text x="16" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800">2. Silence Governor Core</text>
    
    <rect x="12" y="42" width="226" height="42" rx="6" fill="#0369a1" opacity="0.4" />
    <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Critical Check</text>
    <text x="20" y="74" fill="#94a3b8" font-family="sans-serif" font-size="10">critical: true OR in criticalReasons</text>

    <rect x="12" y="90" width="226" height="42" rx="6" fill="#0369a1" opacity="0.4" />
    <text x="20" y="108" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Interruption Budget</text>
    <text x="20" y="122" fill="#94a3b8" font-family="sans-serif" font-size="10">Sliding 1h window (budgetPerHour: 3)</text>

    <rect x="12" y="138" width="226" height="42" rx="6" fill="#0369a1" opacity="0.4" />
    <text x="20" y="156" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Secret Scrubbing Preflight</text>
    <text x="20" y="170" fill="#94a3b8" font-family="sans-serif" font-size="10">redactSecrets() masks credentials</text>
  </g>

  <!-- Top Branch: Critical Immediate Dispatch -->
  <path d="M 515 90 L 595 90" stroke="#ef4444" stroke-width="2.5" />
  <polygon points="595,85 605,90 595,95" fill="#ef4444" />
  <text x="525" y="80" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700">CRITICAL (0ms)</text>

  <!-- Bottom Branch: Non-critical Digest Buffer -->
  <path d="M 515 190 L 595 190" stroke="#f59e0b" stroke-width="2.5" />
  <polygon points="595,185 605,190 595,195" fill="#f59e0b" />
  <text x="520" y="182" fill="#fcd34d" font-family="sans-serif" font-size="10" font-weight="700">DIGEST BUFFER</text>

  <!-- Step 3A: Immediate Dispatch Out -->
  <g transform="translate(610, 56)">
    <rect width="305" height="85" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2" filter="url(#shadow)" />
    <text x="16" y="26" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800">⚡ Immediate Human Escalation</text>
    <text x="16" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Slack Header / MRKDWN Blocks</text>
    <text x="16" y="60" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Discord Rich Embed &amp; Logs</text>
    <text x="16" y="76" fill="#94a3b8" font-family="monospace" font-size="10">👉 agentctl resume &lt;id&gt; --response "..."</text>
  </g>

  <!-- Step 3B: Digest & Batch Flush -->
  <g transform="translate(610, 155)">
    <rect width="305" height="96" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" />
    <text x="16" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="800">📦 Batched Digest Delivery</text>
    <text x="16" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Buffers in .agent/state/escalation-digest.json</text>
    <text x="16" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="11">• Auto-flushes at threshold (5 incidents)</text>
    <text x="16" y="74" fill="#38bdf8" font-family="monospace" font-size="10">👉 agentctl escalate --flush / --status</text>
  </g>
</svg>
