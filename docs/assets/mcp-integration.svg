<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 210" width="100%" height="100%">
  <defs>
    <linearGradient id="mcp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="945" height="210" rx="14" fill="url(#mcp-grad)" stroke="#4338ca" stroke-width="2" />

  <text x="30" y="36" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5">MODEL CONTEXT PROTOCOL (MCP) INTEGRATION</text>

  <!-- Left: AI Clients -->
  <g transform="translate(30, 56)">
    <rect width="210" height="125" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2.5" />
    <text x="18" y="30" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">AI Client Tools</text>
    <text x="18" y="60" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="700">• Google Antigravity (AGY)</text>
    <text x="18" y="82" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="700">• Claude Desktop</text>
    <text x="18" y="104" fill="#ffffff" font-family="sans-serif" font-size="13.5" font-weight="700">• Cursor &amp; VSCode MCP</text>
  </g>

  <!-- Arrow Inbound -->
  <path d="M 245 118 L 260 118" stroke="#f8fafc" stroke-width="3" />
  <polygon points="260,112 269,118 260,124" fill="#f8fafc" />

  <!-- Center: Inbound MCP Server -->
  <g transform="translate(274, 56)">
    <rect width="380" height="125" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <text x="18" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Inbound MCP Server (npx jules-mcp)</text>
    <rect x="16" y="44" width="168" height="28" rx="5" fill="#0369a1" opacity="0.6" />
    <text x="24" y="63" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="700">dispatch_jules_task</text>
    <rect x="196" y="44" width="168" height="28" rx="5" fill="#0369a1" opacity="0.6" />
    <text x="204" y="63" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="700">audit_jules_gate</text>
    <rect x="16" y="80" width="168" height="28" rx="5" fill="#0369a1" opacity="0.6" />
    <text x="24" y="99" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="700">check_risk_tier</text>
    <rect x="196" y="80" width="168" height="28" rx="5" fill="#0369a1" opacity="0.6" />
    <text x="204" y="99" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="700">get_jules_status</text>
  </g>

  <!-- Arrow Outbound -->
  <path d="M 659 118 L 674 118" stroke="#f8fafc" stroke-width="3" />
  <polygon points="674,112 683,118 674,124" fill="#f8fafc" />

  <!-- Right: Outbound MCP Directives -->
  <g transform="translate(688, 56)">
    <rect width="227" height="125" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2.5" />
    <text x="16" y="30" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Outbound Directives</text>
    <text x="16" y="58" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Injected &lt;MCP_DIRECTIVE&gt;</text>
    <text x="16" y="80" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Read-before-write invariants</text>
    <text x="16" y="102" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Context 7 / Docs Sync</text>
  </g>
</svg>
